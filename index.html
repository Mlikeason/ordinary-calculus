<script>
/* ============================================================

// ---------- SVG Function Plotter Utility ----------
function svgPlot(opts) {
  const {
    fn,                       // function or array of {fn, color, dashed, label}
    xMin = -5, xMax = 5,
    yMin = -5, yMax = 5,
    width = 560, height = 320,
    samples = 400,
    points = [],              // [{x, y, color, hollow, label}]
    extras = [],              // raw SVG fragments
    title = '',
    axisLabels = {x: 'x', y: 'y'},
  } = opts;

  const padL = 38, padR = 14, padT = 14, padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
  const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

  const fns = Array.isArray(fn) ? fn : (fn ? [{fn, color: '#2c4a7a'}] : []);

  // Grid
  let grid = '';
  for (let gx = Math.ceil(xMin); gx <= Math.floor(xMax); gx++) {
    const x = sx(gx);
    grid += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT + plotH}" stroke="#eee" stroke-width="1"/>`;
    if (gx !== 0) grid += `<text x="${x}" y="${padT + plotH + 14}" font-size="10" fill="#888" text-anchor="middle">${gx}</text>`;
  }
  for (let gy = Math.ceil(yMin); gy <= Math.floor(yMax); gy++) {
    const y = sy(gy);
    grid += `<line x1="${padL}" y1="${y}" x2="${padL + plotW}" y2="${y}" stroke="#eee" stroke-width="1"/>`;
    if (gy !== 0) grid += `<text x="${padL - 4}" y="${y + 3}" font-size="10" fill="#888" text-anchor="end">${gy}</text>`;
  }

  // Axes
  const x0 = (0 >= xMin && 0 <= xMax) ? sx(0) : null;
  const y0 = (0 >= yMin && 0 <= yMax) ? sy(0) : null;
  let axes = '';
  if (y0 !== null) axes += `<line x1="${padL}" y1="${y0}" x2="${padL + plotW}" y2="${y0}" stroke="#666" stroke-width="1"/>`;
  if (x0 !== null) axes += `<line x1="${x0}" y1="${padT}" x2="${x0}" y2="${padT + plotH}" stroke="#666" stroke-width="1"/>`;

  // Function paths
  let paths = '';
  for (const f of fns) {
    let d = '';
    let prevValid = false;
    for (let i = 0; i <= samples; i++) {
      const x = xMin + (i / samples) * (xMax - xMin);
      let y;
      try { y = f.fn(x); } catch(e) { y = NaN; }
      if (!isFinite(y)) { prevValid = false; continue; }
      if (y < yMin - (yMax - yMin) || y > yMax + (yMax - yMin)) { prevValid = false; continue; }
      const px = sx(x), py = sy(Math.max(yMin - 10, Math.min(yMax + 10, y)));
      d += (prevValid ? ' L' : ' M') + px.toFixed(2) + ' ' + py.toFixed(2);
      prevValid = true;
    }
    paths += `<path d="${d.trim()}" fill="none" stroke="${f.color || '#2c4a7a'}" stroke-width="${f.width || 2}" ${f.dashed ? 'stroke-dasharray="5 4"' : ''}/>`;
  }

  // Points
  let pts = '';
  for (const p of points) {
    const px = sx(p.x), py = sy(p.y);
    if (p.hollow) {
      pts += `<circle cx="${px}" cy="${py}" r="5" fill="white" stroke="${p.color || '#2c4a7a'}" stroke-width="2"/>`;
    } else {
      pts += `<circle cx="${px}" cy="${py}" r="4.5" fill="${p.color || '#2c4a7a'}"/>`;
    }
    if (p.label) {
      pts += `<text x="${px + 8}" y="${py - 8}" font-size="11" fill="${p.color || '#2c4a7a'}">${p.label}</text>`;
    }
  }

  // Legend
  let legend = '';
  if (fns.some(f => f.label)) {
    let lx = padL + 8, ly = padT + 14;
    for (const f of fns) {
      if (!f.label) continue;
      legend += `<line x1="${lx}" y1="${ly}" x2="${lx + 18}" y2="${ly}" stroke="${f.color || '#2c4a7a'}" stroke-width="2" ${f.dashed ? 'stroke-dasharray="4 3"' : ''}/>`;
      legend += `<text x="${lx + 24}" y="${ly + 4}" font-size="11" fill="#333">${f.label}</text>`;
      ly += 16;
    }
  }

  const titleEl = title ? `<text x="${width/2}" y="${padT - 2}" font-size="11" fill="#666" text-anchor="middle">${title}</text>` : '';

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px; display:block;" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}${paths}${extras.join('')}${pts}${legend}${titleEl}
  </svg>`;
}

// ---------- Lessons Data ----------
const MODULES = [
  { id: 'M1', name: '预备知识', desc: '函数与初等运算' },
  { id: 'M2', name: '极限与连续', desc: '微积分的基石' },
  { id: 'M3', name: '导数', desc: '微积分的核心 · 7 节完整' },
  { id: 'M4', name: '导数的应用', desc: '6 节完整 · 求导的实战' },
  { id: 'M5', name: '积分', desc: '7 节完整 · 导数的逆运算' },
  { id: 'M6', name: '积分的应用', desc: '6 节完整 · 面积、体积、弧长' },
];

const LESSONS = [
  // ============== M1 预备知识 ==============
  {
    id: 1, module: 'M1', title: '函数与图像',
    hook: '函数是把"输入"映射到"输出"的规则。给它一个数，它还你另一个数。',
    sections: [
      { type: 'text', html: `
        <p><strong>定义</strong>。函数 $f: A \\to B$ 是一个规则：对集合 $A$ 中的每个 $x$，唯一对应集合 $B$ 中的一个值 $f(x)$。$A$ 称为<strong>定义域</strong>，所有 $f(x)$ 的集合称为<strong>值域</strong>。</p>
        <p><strong>图像</strong>。在坐标系中描出所有形如 $(x, f(x))$ 的点，连成的轨迹就是函数的图像。"竖线检验"：任何一条竖线和图像至多交于一点。</p>
        <p>三类常见的初等函数：</p>
        <ul>
          <li>线性：$f(x) = ax + b$，图像是直线</li>
          <li>二次：$f(x) = ax^2 + bx + c$，图像是抛物线</li>
          <li>幂函数：$f(x) = x^n$（如 $x^3$、$\\sqrt{x} = x^{1/2}$）</li>
        </ul>
        <p><strong>定义域</strong>由两类限制决定：① 分母不能为零；② 偶次根号下要非负。例如 $f(x) = \\dfrac{1}{\\sqrt{x-1}}$ 要求 $x > 1$。</p>
      `},
      { type: 'viz', id: 'viz-l1', label: '可切换不同函数观察图像' },
    ],
    exercises: [
      {
        type: 'mc',
        q: '函数 $f(x) = \\sqrt{x - 3}$ 的定义域是？',
        options: ['$x > 0$', '$x \\geq 3$', '$x \\neq 3$', '$\\mathbb{R}$'],
        answer: 1,
        solution: '根号下要非负：$x - 3 \\geq 0 \\Rightarrow x \\geq 3$。',
      },
      {
        type: 'fill',
        q: '若 $f(x) = x^2 + 1$，则 $f(-2) = $',
        answer: '5',
        solution: '$f(-2) = (-2)^2 + 1 = 4 + 1 = 5$。',
      },
      {
        type: 'mc',
        q: '下列哪条曲线<strong>不是</strong>函数？',
        options: ['$y = x^2$', '$y = \\pm\\sqrt{x}$（圆的右半）', '$y = \\sin x$', '$y = e^x$'],
        answer: 1,
        solution: '$y = \\pm\\sqrt{x}$ 对同一 $x$ 给出两个 $y$ 值，违反"唯一对应"。竖线检验也通不过。',
      },
    ],
  },

  {
    id: 2, module: 'M1', title: '复合与反函数',
    hook: '函数可以"套娃"，也可以"反过来用"。',
    sections: [
      { type: 'text', html: `
        <p><strong>复合函数</strong>。先用 $g$ 再用 $f$，记作 $(f \\circ g)(x) = f(g(x))$。注意顺序——外层函数在左边。</p>
        <p>例：$f(x) = 2x + 1$，$g(x) = x^2$，则 $(f \\circ g)(x) = 2x^2 + 1$，而 $(g \\circ f)(x) = (2x+1)^2$。两者通常不相等。</p>
        <p><strong>反函数</strong>。若 $f$ 是一一对应（每个 $y$ 只对应一个 $x$），则存在 $f^{-1}$ 满足</p>
        <p>$$f(f^{-1}(x)) = x, \\quad f^{-1}(f(x)) = x.$$</p>
        <p><strong>求反函数三步</strong>：① 写 $y = f(x)$；② 解出 $x$ 用 $y$ 表示；③ 交换 $x, y$。</p>
        <p>例：$f(x) = 2x + 1 \\Rightarrow y = 2x+1 \\Rightarrow x = \\dfrac{y-1}{2} \\Rightarrow f^{-1}(x) = \\dfrac{x-1}{2}$。</p>
        <p><strong>几何性质</strong>：$f$ 与 $f^{-1}$ 的图像关于直线 $y = x$ 对称。</p>
      `},
      { type: 'viz', id: 'viz-l2', label: '观察 $f$ 与 $f^{-1}$ 关于 $y=x$ 对称' },
    ],
    exercises: [
      {
        type: 'fill',
        q: '若 $f(x) = x + 1$，$g(x) = x^2$，则 $f(g(2)) = $',
        answer: '5',
        solution: '$g(2) = 4$，$f(4) = 4 + 1 = 5$。',
      },
      {
        type: 'fill',
        q: '若 $f(x) = x^3$，则 $f^{-1}(8) = $',
        answer: '2',
        solution: '$f^{-1}(x) = \\sqrt[3]{x}$，所以 $f^{-1}(8) = 2$。',
      },
      {
        type: 'mc',
        q: '函数 $f(x) = 3x - 2$ 的反函数是？',
        options: ['$\\dfrac{x+2}{3}$', '$\\dfrac{x-2}{3}$', '$3x + 2$', '$\\dfrac{1}{3x-2}$'],
        answer: 0,
        solution: '设 $y = 3x - 2$，解得 $x = \\dfrac{y+2}{3}$，故 $f^{-1}(x) = \\dfrac{x+2}{3}$。',
      },
    ],
  },

  {
    id: 3, module: 'M1', title: '三角函数',
    hook: '三角函数源于直角三角形的边长比，扩展到所有实数后变成"振荡"的函数。',
    sections: [
      { type: 'text', html: `
        <p><strong>弧度制</strong>。一周 $= 2\\pi$ 弧度 $= 360°$。常用换算：$30° = \\dfrac{\\pi}{6}$，$45° = \\dfrac{\\pi}{4}$，$60° = \\dfrac{\\pi}{3}$，$90° = \\dfrac{\\pi}{2}$。</p>
        <p><strong>单位圆定义</strong>。在单位圆上，从 $x$ 轴正向逆时针转角度 $\\theta$ 到达点 $(\\cos\\theta, \\sin\\theta)$。这把三角函数从直角三角形扩展到了任意实数。</p>
        <p><strong>核心恒等式</strong>：</p>
        <p>$$\\sin^2\\theta + \\cos^2\\theta = 1, \\quad \\tan\\theta = \\dfrac{\\sin\\theta}{\\cos\\theta}.$$</p>
        <p><strong>必背特殊值</strong>：</p>
        <ul>
          <li>$\\sin 0 = 0$，$\\sin\\dfrac{\\pi}{6} = \\dfrac{1}{2}$，$\\sin\\dfrac{\\pi}{4} = \\dfrac{\\sqrt{2}}{2}$，$\\sin\\dfrac{\\pi}{3} = \\dfrac{\\sqrt{3}}{2}$，$\\sin\\dfrac{\\pi}{2} = 1$</li>
          <li>$\\cos$ 在这些角的值反着排：$1, \\dfrac{\\sqrt{3}}{2}, \\dfrac{\\sqrt{2}}{2}, \\dfrac{1}{2}, 0$</li>
        </ul>
        <p><strong>周期性</strong>：$\\sin, \\cos$ 周期为 $2\\pi$；$\\tan$ 周期为 $\\pi$。</p>
      `},
      { type: 'viz', id: 'viz-l3', label: '拖动滑块：单位圆角度对应正弦曲线' },
    ],
    exercises: [
      {
        type: 'fill',
        q: '$\\sin\\left(\\dfrac{\\pi}{6}\\right) = $（用小数或分数）',
        answer: '1/2',
        accept: ['0.5', '1/2'],
        solution: '$30°$ 的正弦值是 $\\dfrac{1}{2}$。',
      },
      {
        type: 'fill',
        q: '$\\tan\\left(\\dfrac{\\pi}{4}\\right) = $',
        answer: '1',
        solution: '$\\tan\\dfrac{\\pi}{4} = \\dfrac{\\sin(\\pi/4)}{\\cos(\\pi/4)} = 1$。',
      },
      {
        type: 'mc',
        q: '$\\cos^2 x + \\sin^2 x$ 等于？',
        options: ['$x^2$', '$1$', '$2x$', '取决于 $x$'],
        answer: 1,
        solution: '基本恒等式：单位圆上的点 $(\\cos x, \\sin x)$ 到原点距离为 1。',
      },
    ],
  },

  {
    id: 4, module: 'M1', title: '指数与对数',
    hook: '指数描述爆炸式增长，对数是它的"反操作"——问"增长了多少次"。',
    sections: [
      { type: 'text', html: `
        <p><strong>指数</strong>。$a^x$ 其中 $a > 0, a \\neq 1$。运算性质：</p>

    id: 6, module: 'M2', title: '极限的运算法则',
    hook: '上一节我们看图、看趋势来感受极限。但每次都画图太累——其实极限对加减乘除都"守规矩"，多数情况可以像普通算术一样直接算出来。',

      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">极限"懂规矩"</h3>
        <p>设两个函数 $f(x), g(x)$ 在 $x \\to a$ 时分别趋于 $L$ 和 $M$。直觉上："把它们加起来"的趋势就该是 $L + M$；"把它们乘起来"的趋势就该是 $L \\cdot M$。极限就是这么"听话"：</p>
        <p>$$\\lim_{x \\to a}\\bigl[f(x) \\pm g(x)\\bigr] = L \\pm M$$</p>
        <p>$$\\lim_{x \\to a}\\bigl[f(x) \\cdot g(x)\\bigr] = L \\cdot M$$</p>
        <p>$$\\lim_{x \\to a}\\frac{f(x)}{g(x)} = \\frac{L}{M} \\quad (\\text{要求 } M \\neq 0)$$</p>
        <p>$$\\lim_{x \\to a}\\bigl[c \\cdot f(x)\\bigr] = c \\cdot L \\quad (c \\text{ 是常数})$$</p>
        <p>这四条就是<strong>极限的运算法则</strong>。可以放心用。<strong>唯一的坑是除法那条要求 $M \\neq 0$</strong>——这正是 $\\dfrac{0}{0}$ 麻烦的根源。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">代入大法</h3>
        <p>上面四条规则一个直接的推论：<strong>多项式可以直接代入求极限</strong>。举例：</p>
        <p>$$\\lim_{x \\to 2}(x^3 - 3x + 1).$$</p>
        <p>用法则拆开成 $\\lim x^3 - \\lim 3x + \\lim 1$，每一项都直接代入 $x = 2$：$8 - 6 + 1 = 3$。所以极限是 <strong>3</strong>。</p>
        <p>同理，有理函数 $\\dfrac{P(x)}{Q(x)}$（多项式之比）当 $Q(a) \\neq 0$ 时也可以直接代入。例如 $\\lim\\limits_{x \\to 1}\\dfrac{x^2 + 2}{x + 3} = \\dfrac{1 + 2}{1 + 3} = \\dfrac{3}{4}$。</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          <strong>一句话口诀</strong>：能直接代入就直接代入。代入后只要不出问题（不是 $\\dfrac{0}{0}$、不是 $\\infty - \\infty$ 等"未定式"），那就是答案。
        </div>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">遇到 $\\dfrac{0}{0}$ 怎么办？</h3>
        <p>代入后得到 $\\dfrac{0}{0}$，意思是"分子分母同时趋于 0"。这种"双零打架"叫<strong>未定式</strong>——它不是答案，而是一个信号：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <strong>分子和分母里藏着同一个"小因子"，可以约掉。</strong>
        </div>
        <p>三种常用招数把那个"小因子"挖出来：</p>
        <ul>
          <li><strong>因式分解</strong>：把分子分母拆成乘积形式，找到公共因子约掉。</li>
          <li><strong>有理化</strong>：分子或分母含根号时，乘以共轭式（$\\sqrt{a} - \\sqrt{b}$ 配 $\\sqrt{a} + \\sqrt{b}$），把根号"拆开"。</li>
          <li><strong>等价无穷小替换</strong>：把 $\\sin x, \\ln(1+x)$ 等替换成简单的 $x$（下一节专讲）。</li>
        </ul>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做两道</h3>
        <p><strong>例 1（因式分解）</strong>：求 $\\lim\\limits_{x \\to 3}\\dfrac{x^2 - 9}{x - 3}$。</p>
        <p>第一步，先代入试一下：分子 $9 - 9 = 0$，分母 $3 - 3 = 0$——$\\dfrac{0}{0}$ 信号亮起。</p>
        <p>第二步，挖公共因子。注意 $x^2 - 9 = (x-3)(x+3)$，正好含 $(x-3)$：</p>
        <p>$$\\frac{(x-3)(x+3)}{x - 3} = x + 3 \\quad (\\text{当 } x \\neq 3).$$</p>
        <p>第三步，现在代入就安全了：$\\lim\\limits_{x \\to 3}(x + 3) = 6$。<strong>答：6。</strong></p>
        <p style="margin-top:1.4em;"><strong>例 2（有理化）</strong>：求 $\\lim\\limits_{x \\to 0}\\dfrac{\\sqrt{x + 4} - 2}{x}$。</p>
        <p>第一步，代入：分子 $\\sqrt{4} - 2 = 0$，分母 $= 0$——又是 $\\dfrac{0}{0}$。</p>
        <p>第二步，分子有根号，用共轭式 $\\sqrt{x+4} + 2$ 同乘分子分母：</p>
        <p>$$\\frac{(\\sqrt{x+4} - 2)(\\sqrt{x+4} + 2)}{x(\\sqrt{x+4} + 2)} = \\frac{(x+4) - 4}{x(\\sqrt{x+4} + 2)} = \\frac{x}{x(\\sqrt{x+4} + 2)}.$$</p>
        <p>（用了平方差公式 $(a-b)(a+b) = a^2 - b^2$。）</p>
        <p>第三步，分子分母都有 $x$，约掉：$\\dfrac{1}{\\sqrt{x+4} + 2}$。代入 $x = 0$：$\\dfrac{1}{\\sqrt{4} + 2} = \\dfrac{1}{4}$。<strong>答：$\\dfrac{1}{4}$。</strong></p>

        </div>
      `},

        <p><strong>为什么是 1？</strong> 在单位圆上，角度 $x$（弧度）对应的弧长就是 $x$；而 $\\sin x$ 是从圆上那一点到 $x$ 轴的<strong>垂线长</strong>。当 $x$ 很小时，那一小段弧几乎就是直的，垂线和弧"几乎一样长"。所以比值越来越靠近 1。</p>

        <p>$$\\lim_{x \\to \\infty}\\left(1 + \\frac{1}{x}\\right)^x = e \\approx 2.71828\\ldots$$</p>
        <p><strong>这个 $e$ 是哪来的？</strong> 想象 100% 年利率，本金 1 块钱。</p>

          <li>一年算无穷多次（每一瞬间都滚）：极限 $= e \\approx 2.71828$ 块</li>

        <p>这就是<strong>连续复利</strong>的极致结果——$e$ 不是数学家凭空发明的，是这种自然过程算出来的。</p>

        <p>$$\\lim_{x \\to a} f(x) = f(a).$$</p>

  {
    id: 14, module: 'M3', title: '四则运算法则',
    hook: '上节我们记熟了基本公式表——但实际函数往往是基本函数加减乘除拼出来的"组合体"，比如 $x^2 \\sin x$ 或 $\\dfrac{x+1}{x^2+2}$。这一节学这四种组合的求导规则。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">和差与常数倍——直觉规则</h3>
        <p>这两条最简单：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$\\bigl[f(x) \\pm g(x)\\bigr]' = f'(x) \\pm g'(x)$$
          $$\\bigl[c \\cdot f(x)\\bigr]' = c \\cdot f'(x) \\quad (c \\text{ 是常数})$$
        </div>
        <p>直觉：把函数想象成"两段独立的运动"。整体的变化率，就是各自变化率的和。常数倍同理——速度放大 $c$ 倍，速度的变化率也跟着放大 $c$ 倍。</p>
        <p><strong>例 1</strong>：求 $f(x) = 3x^2 + \\sin x$ 的导数。</p>
        <p>$f'(x) = (3x^2)' + (\\sin x)' = 3 \\cdot 2x + \\cos x = 6x + \\cos x$。</p>
        <p>就这么直接——和差与常数倍可以"逐项处理"。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">乘积法则——容易记错的</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$\\bigl[f(x) \\cdot g(x)\\bigr]' = f'(x) \\cdot g(x) + f(x) \\cdot g'(x)$$
        </div>
        <p>注意：<strong>不是 $f' \\cdot g'$</strong>！很多人会想当然写成"导数的乘积"，但那是错的。正确公式是<strong>"左导右不导 + 左不导右导"</strong>。</p>
        <p>为什么是这样？想象一个矩形，长 $f$ 宽 $g$，面积是 $fg$。如果长增加 $\\Delta f$、宽增加 $\\Delta g$，面积变化主要来自两部分：长边方向的增量 $\\Delta f \\cdot g$ 和宽边方向的增量 $f \\cdot \\Delta g$（再加一个微小的 $\\Delta f \\cdot \\Delta g$，是二阶小量可忽略）。取极限就是公式。</p>
        <p><strong>例 2</strong>：求 $f(x) = x^2 \\sin x$ 的导数。</p>
        <p>设 $u = x^2$，$v = \\sin x$。则 $u' = 2x$，$v' = \\cos x$。</p>
        <p>$f'(x) = u'v + uv' = 2x \\cdot \\sin x + x^2 \\cdot \\cos x = 2x \\sin x + x^2 \\cos x$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">商法则——长得有点吓人</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$\\left[\\frac{f(x)}{g(x)}\\right]' = \\frac{f'(x) \\cdot g(x) - f(x) \\cdot g'(x)}{[g(x)]^2}$$
        </div>
        <p>记忆口诀：<strong>"分子是导差，分母平方"</strong>。</p>
        <ul>
          <li>分子：上导 × 下 $-$ 上 × 下导（注意是<strong>减</strong>号，顺序不能反）</li>
          <li>分母：原来的分母 $g(x)$ 平方</li>
        </ul>
        <p><strong>例 3</strong>：求 $f(x) = \\dfrac{\\sin x}{x}$ 的导数（$x \\neq 0$）。</p>
        <p>分子 $= (\\sin x)' \\cdot x - \\sin x \\cdot (x)' = \\cos x \\cdot x - \\sin x \\cdot 1 = x \\cos x - \\sin x$。</p>
        <p>分母 $= x^2$。</p>
        <p>所以 $f'(x) = \\dfrac{x \\cos x - \\sin x}{x^2}$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做几道</h3>
        <p><strong>例 4</strong>：求 $f(x) = (x^2 + 1)(x^3 - 2x)$ 的导数。</p>
        <p>用乘积法则。$u = x^2 + 1$，$v = x^3 - 2x$。$u' = 2x$，$v' = 3x^2 - 2$。</p>
        <p>$f'(x) = u'v + uv' = 2x(x^3 - 2x) + (x^2 + 1)(3x^2 - 2)$。</p>
        <p>展开化简：$= 2x^4 - 4x^2 + 3x^4 - 2x^2 + 3x^2 - 2 = 5x^4 - 3x^2 - 2$。</p>

        <p style="margin-top:1.4em;"><strong>例 5</strong>：求 $f(x) = \\dfrac{e^x}{x}$ 的导数。</p>
        <p>商法则。$u = e^x$，$v = x$。$u' = e^x$，$v' = 1$。</p>
        <p>$f'(x) = \\dfrac{e^x \\cdot x - e^x \\cdot 1}{x^2} = \\dfrac{e^x(x - 1)}{x^2}$。</p>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：乘积法则<strong>最常错</strong>——很多人会想当然写成 $f'g'$。用"左导右不导 + 左不导右导"的口诀避免。商法则的减号顺序也容易反——记住<strong>分子开头是"上导×下"</strong>就不会错。
        </div>
      ` },

  {
    id: 15, module: 'M3', title: '链式法则：剥洋葱',
    hook: '这一节是整个微积分计算技巧里<strong>最关键</strong>的一条规则。掌握了链式法则，你几乎能求任何函数的导数；不会，那大多数"看起来复杂"的函数都束手无策。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">先回顾：复合函数</h3>
        <p>L2 学过：复合函数就是"函数套函数"，记作 $f(g(x))$ 或 $(f \\circ g)(x)$，意思是"先用 $g$，再用 $f$"。</p>
        <p>几个例子：</p>
        <ul>
          <li>$\\sin(x^2)$：外层 $f(u) = \\sin u$，内层 $g(x) = x^2$</li>
          <li>$e^{2x + 1}$：外层 $f(u) = e^u$，内层 $g(x) = 2x + 1$</li>
          <li>$\\ln(\\cos x)$：外层 $f(u) = \\ln u$，内层 $g(x) = \\cos x$</li>
        </ul>
        <p>要求这种"套娃函数"的导数，光凭基本公式表 + 四则法则<strong>不够用</strong>——必须有专门的规则。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">链式法则</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$\\bigl[f(g(x))\\bigr]' = f'(g(x)) \\cdot g'(x)$$
          <p style="margin-top:0.6em;margin-bottom:0;">用 Leibniz 记号更直观（设 $y = f(u)$，$u = g(x)$）：</p>
          $$\\frac{dy}{dx} = \\frac{dy}{du} \\cdot \\frac{du}{dx}$$
        </div>
        <p>口诀：<strong>"外层的导数（保留内层不动）× 内层的导数"</strong>。像剥洋葱——从外到里一层层处理。</p>
        <p>Leibniz 记号像分数相乘，这并非巧合——它把"$y$ 通过中间变量 $u$ 间接依赖 $x$"这一关系直接表达了出来。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做几道（详细推导）</h3>
        <p><strong>例 1</strong>：求 $(\\sin(2x))'$。</p>
        <p>识别结构：外层 $f(u) = \\sin u$，内层 $g(x) = 2x$。</p>
        <ul>
          <li>外层导数：$f'(u) = \\cos u$。代回 $u = 2x$，得 $\\cos(2x)$。</li>
          <li>内层导数：$g'(x) = 2$。</li>
        </ul>
        <p>链式相乘：$(\\sin(2x))' = \\cos(2x) \\cdot 2 = 2\\cos(2x)$。</p>

        <p style="margin-top:1.4em;"><strong>例 2</strong>：求 $(e^{x^2})'$。</p>
        <p>外层 $f(u) = e^u$，内层 $g(x) = x^2$。</p>
        <ul>
          <li>外层导数：$f'(u) = e^u$。代回得 $e^{x^2}$。</li>
          <li>内层导数：$g'(x) = 2x$。</li>
        </ul>
        <p>$(e^{x^2})' = e^{x^2} \\cdot 2x = 2x \\, e^{x^2}$。</p>

        <p style="margin-top:1.4em;"><strong>例 3</strong>：求 $(\\ln(x^2 + 1))'$。</p>
        <p>外层 $f(u) = \\ln u$，内层 $g(x) = x^2 + 1$。</p>
        <ul>
          <li>外层导数：$f'(u) = \\dfrac{1}{u}$，代回得 $\\dfrac{1}{x^2 + 1}$。</li>
          <li>内层导数：$g'(x) = 2x$。</li>
        </ul>
        <p>$(\\ln(x^2 + 1))' = \\dfrac{1}{x^2 + 1} \\cdot 2x = \\dfrac{2x}{x^2 + 1}$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">多层嵌套</h3>
        <p>函数可以"三层套娃"以上——比如 $\\sin(e^{x^2})$。处理办法：从最外层开始，一层一层往里剥。</p>
        <p><strong>例 4</strong>：求 $(\\sin(e^{x^2}))'$。</p>
        <p>结构分析：</p>
        <ul>
          <li>最外层：$\\sin(\\cdot)$</li>
          <li>中间层：$e^{(\\cdot)}$</li>
          <li>最内层：$x^2$</li>
        </ul>
        <p>从外到内逐层求导（每层都保留内部不动）：</p>
        <ul>
          <li>最外层 $\\sin$ 导出：$\\cos(e^{x^2})$</li>
          <li>中间层 $e^u$ 导出：$e^{x^2}$</li>
          <li>最内层 $x^2$ 导出：$2x$</li>
        </ul>
        <p>三个连乘：$(\\sin(e^{x^2}))' = \\cos(e^{x^2}) \\cdot e^{x^2} \\cdot 2x = 2x \\, e^{x^2} \\cos(e^{x^2})$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">和其他法则联合</h3>
        <p>链式法则经常和四则法则配合用。比如 $(x^2 \\sin(3x))'$ 既是乘积、里面又有复合：</p>
        <ul>
          <li>外层是乘积法则：$u\' v + u v\'$，其中 $u = x^2$，$v = \\sin(3x)$</li>
          <li>$u\' = 2x$</li>
          <li>$v\'$ 用链式：外 $\\sin$ 导出 $\\cos(3x)$，内 $3x$ 导出 $3$，得 $v\' = 3\\cos(3x)$</li>
          <li>合起来：$2x \\cdot \\sin(3x) + x^2 \\cdot 3\\cos(3x) = 2x\\sin(3x) + 3x^2\\cos(3x)$</li>
        </ul>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：链式法则是<strong>练出来的</strong>能力——读 10 次不如做 5 道题。看到复合函数，先停下来识别"外层是什么、内层是什么"。多层嵌套时，从外到内，机械地按"外导（保留内）× 内导"一层层处理。配合 Leibniz 记号 $\\dfrac{dy}{du} \\cdot \\dfrac{du}{dx}$，更不容易出错。
        </div>
      ` },

  {
    id: 16, module: 'M3', title: '隐函数与参数方程求导',
    hook: '之前所有函数都长 $y = f(x)$ 的样——给 $x$ 直接算 $y$。但有时候 $y$ 藏在方程里（圆 $x^2 + y^2 = 1$），或者由第三个变量控制（$x = \\cos t,\\, y = \\sin t$）。这一节学这两种情况怎么求导。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">什么是隐函数</h3>
        <p><strong>显函数</strong>：$y = f(x)$，给 $x$ 直接算 $y$，如 $y = x^2 + 1$。</p>
        <p><strong>隐函数</strong>：$y$ 没有显式表达式，只通过方程和 $x$ 关联，如 $x^2 + y^2 = 1$（单位圆）。</p>
        <p>圆上每个 $x \\in (-1, 1)$ 实际对应<strong>两个</strong> $y$（上半圆和下半圆），所以严格说"圆"不是单值函数。但<strong>局部</strong>看，每一段都可以视为 $y$ 关于 $x$ 的函数——只是写不出闭合公式罢了。</p>
        <p>我们想求曲线上某点的切线斜率 $\\dfrac{dy}{dx}$——但 $y$ 都没显式表达，怎么求导？</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">隐函数求导：对方程两边求导</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <strong>做法</strong>：方程两边都对 $x$ 求导。<strong>关键</strong>：把 $y$ 当成 $x$ 的函数——求 $y$ 的某个函数（比如 $y^2$）的导数时，要用<strong>链式法则</strong>。
        </div>
        <p>具体说：</p>
        <ul>
          <li>$(y^2)' = 2y \\cdot y'$（外层 $u^2$ 导出 $2u$，内层 $y$ 对 $x$ 求导是 $y'$）</li>
          <li>$(\\sin y)' = \\cos y \\cdot y'$</li>
          <li>$(e^y)' = e^y \\cdot y'$</li>
        </ul>
        <p>注意每一项后面都跟个 $y'$——这是链式法则在起作用。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做一道（圆）</h3>
        <p>求 $x^2 + y^2 = 1$ 的 $\\dfrac{dy}{dx}$。</p>
        <p>第一步，两边对 $x$ 求导：</p>
        <p>$$(x^2)' + (y^2)' = (1)'$$</p>
        <p>第二步，每项分别处理：</p>
        <ul>
          <li>$(x^2)' = 2x$</li>
          <li>$(y^2)' = 2y \\cdot y'$（链式法则！$y$ 是 $x$ 的函数）</li>
          <li>$(1)' = 0$</li>
        </ul>
        <p>合起来：$2x + 2y \\cdot y' = 0$。</p>
        <p>第三步，解 $y'$：</p>
        <p>$$y' = -\\frac{x}{y}.$$</p>
        <p><strong>意义</strong>：圆上点 $(x, y)$ 处的切线斜率是 $-\\dfrac{x}{y}$。验证一下：点 $(0, 1)$（最上方）斜率 $0$（水平切线，对！）；点 $(1, 0)$（最右）分母为 0 → 斜率无穷大（垂直切线，对！）。</p>

      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-8 mb-3">复杂一点的例题</h3>
        <p>求 $xy + \\sin y = 1$ 的 $\\dfrac{dy}{dx}$。</p>
        <p>两边对 $x$ 求导。注意 $xy$ 要用<strong>乘积法则</strong>：</p>
        <ul>
          <li>$(xy)' = (x)' \\cdot y + x \\cdot (y)' = y + x \\cdot y'$</li>
          <li>$(\\sin y)' = \\cos y \\cdot y'$（链式）</li>
          <li>$(1)' = 0$</li>
        </ul>
        <p>合起来：$y + x \\cdot y' + \\cos y \\cdot y' = 0$。</p>
        <p>把含 $y'$ 的项归到一边：$y'(x + \\cos y) = -y$，解得 $y' = \\dfrac{-y}{x + \\cos y}$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">参数方程求导</h3>
        <p>第二种情形：$x$ 和 $y$ 都是某个第三变量（通常叫参数 $t$）的函数：</p>
        <p>$$x = x(t), \\quad y = y(t).$$</p>
        <p>例如圆的参数方程：$x = \\cos t,\\, y = \\sin t$（$t$ 是角度）。要求 $\\dfrac{dy}{dx}$ 怎么办？</p>

        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">

  {

    hook: '导数本身也是个函数——既然是函数，就可以继续对它求导。这叫<strong>高阶导数</strong>。物理上你已经见过一连串：位移 → 速度 → 加速度 → 急动度。这一节把这种"导了再导"系统化。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">二阶导数</h3>
        <p>函数 $f(x)$ 的导数 $f'(x)$ 仍是一个函数；对它再求一次导，得到的就是<strong>二阶导数</strong>，记作：</p>
        <p>$$f''(x), \\quad \\frac{d^2 y}{d x^2}, \\quad \\frac{d^2 f}{d x^2}.$$</p>
        <p><strong>例</strong>：$f(x) = x^3$。</p>
        <ul>
          <li>一阶：$f'(x) = 3x^2$</li>
          <li>二阶：$f''(x) = (3x^2)' = 6x$</li>
        </ul>
        <p>就这么简单——把"求导"这个动作重复两次。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">更高阶</h3>
        <p>类推下去：</p>
        <p>$$f'''(x), \\quad f^{(4)}(x), \\quad f^{(5)}(x), \\, \\ldots, \\quad f^{(n)}(x).$$</p>
        <p>三阶以前一般写 $f'''$（三撇），从第 4 阶开始用 $f^{(n)}$（圆括号内写数字，避免撇号太多看不清）。</p>
        <p>Leibniz 记号同理：$\\dfrac{d^3 y}{d x^3}, \\dfrac{d^4 y}{d x^4}, \\ldots, \\dfrac{d^n y}{d x^n}$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">几个值得记住的例子</h3>
        <p><strong>多项式：阶数高到底就归零。</strong> $f(x) = x^4$：</p>
        <ul>
          <li>$f' = 4x^3$，$f'' = 12x^2$，$f''' = 24x$，$f^{(4)} = 24$，$f^{(5)} = 0$ → 之后全是 0</li>
        </ul>
        <p>规律：$x^n$ 的第 $n$ 阶导数 $= n!$（阶乘），从第 $n+1$ 阶开始全是 0。</p>

        <p style="margin-top:1.4em;"><strong>$e^x$：所有高阶都是 $e^x$。</strong></p>
        <p>$f^{(n)}(x) = e^x$ 对任意 $n$ 成立——这就是 $e^x$ 在微积分里的"超能力"。</p>

        <p style="margin-top:1.4em;"><strong>$\\sin x$：4 阶一个周期。</strong></p>
        <ul>
          <li>$f = \\sin x$</li>
          <li>$f' = \\cos x$</li>
          <li>$f'' = -\\sin x$</li>
          <li>$f''' = -\\cos x$</li>
          <li>$f^{(4)} = \\sin x$（回到起点！）</li>
        </ul>
        <p>所以 $f^{(n)}$ 只要看 $n$ 除以 4 的余数就知道是哪个。</p>
      ` },
      { type: 'viz', id: 'viz-l17', label: 'sin 与它的前三阶导数：每条相对前一条向左平移 π/2' },
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-8 mb-3">物理意义：导数的"导数链"</h3>
        <p>把位移 $s(t)$ 关于时间求导，你会得到一串熟悉的物理量：</p>
        <ul>
          <li>$s(t)$ —— <strong>位移</strong>（位置）</li>
          <li>$s'(t)$ —— <strong>速度</strong>（位置的变化率）</li>
          <li>$s''(t)$ —— <strong>加速度</strong>（速度的变化率）</li>
          <li>$s'''(t)$ —— <strong>急动度 jerk</strong>（加速度的变化率；过山车那种"猛地一晃"的感觉）</li>
        </ul>
        <p>所以加速度本质上就是"位移的二阶导数"——这在牛顿第二定律 $F = ma$ 里直接出现。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">几何意义：二阶导数与凹凸</h3>
        <p>$f'$ 告诉你函数<strong>上升还是下降</strong>。$f''$ 告诉你函数<strong>凹向哪边</strong>：</p>

    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">导数符号决定升降</h3>
        <p>回想 L12：导数 $f'(x)$ 是切线斜率。斜率为正 → 切线向上倾斜 → 函数在<strong>上升</strong>；斜率为负 → 函数在<strong>下降</strong>。把这个观察推广到一整段区间：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <strong>判定法</strong>：在区间 $I$ 上，
          <ul style="margin-top:0.4em;margin-bottom:0;">
            <li>若 $f'(x) > 0$ 处处成立 → $f$ 在 $I$ 上 <strong>单调递增</strong></li>
            <li>若 $f'(x) < 0$ 处处成立 → $f$ 在 $I$ 上 <strong>单调递减</strong></li>
            <li>若 $f'(x) = 0$ 处处成立 → $f$ 在 $I$ 上 <strong>是常数</strong></li>
          </ul>
        </div>
        <p>这条规则是 M4 一切应用的根基。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">求单调区间的标准流程</h3>
        <ol style="list-style:decimal;padding-left:1.5em;">
          <li>算 $f'(x)$</li>
          <li>解方程 $f'(x) = 0$（或 $f'$ 不存在的点）——这些叫<strong>驻点</strong>，是单调性可能切换的"分界点"</li>
          <li>用驻点把数轴切成几段，每一段任取一个测试点判断 $f'$ 的符号</li>
          <li>$f'>0$ 的段就是递增区间，$f'<0$ 的段就是递减区间</li>
        </ol>
      ` },

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做一道</h3>
        <p>求 $f(x) = x^3 - 3x$ 的单调区间。</p>

        <p>第二步：$f'(x) = 0 \\Rightarrow x = \\pm 1$。这两个驻点把数轴切成三段：$(-\\infty, -1)$、$(-1, 1)$、$(1, +\\infty)$。</p>

  {
    id: 19, module: 'M4', title: '极值',
    hook: '函数图像上的"小山顶"和"小山谷"——它们是哪些点？怎么找？这是上一节单调性概念的直接应用。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">什么是极值</h3>
        <p><strong>极大值</strong>：在某点 $c$ 附近（一个小邻域内），$f(c)$ 是最大的。"邻域内"是关键——这是<strong>局部</strong>概念，不是全局最大。</p>
        <p><strong>极小值</strong>：类似，在某点附近 $f(c)$ 最小。</p>
        <p>注意：函数可以有多个极大值（多个小山顶）和多个极小值（多个山谷）。一个极大值未必比另一个极大值大——它们都只在<strong>各自附近</strong>最大。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">必要条件：驻点</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <strong>费马定理</strong>：若 $c$ 是 $f$ 的极值点（且 $f$ 在 $c$ 处可导），则必有 $f'(c) = 0$。
        </div>
        <p>直觉：在山顶/山谷处，切线必须水平（不然就还能更高/更低）。</p>
        <p>使 $f'(c) = 0$ 或 $f'$ 不存在的点统称为<strong>驻点</strong>（critical points）。<strong>所有极值都在驻点中</strong>——所以找极值的第一步就是找驻点。</p>
        <p><strong>陷阱</strong>：驻点不一定是极值点。如 $f(x) = x^3$，$f'(0) = 0$ 但 $x = 0$ 既不是极大也不是极小（它是个"拐点"，下下节会专讲）。所以费马定理是<strong>必要</strong>条件，不是充分条件。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">充分条件：一阶导数变号</h3>
        <p>要确认一个驻点 $c$ 是哪种极值：看 $f'(x)$ 在 $c$ 两侧的<strong>符号变化</strong>。</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <ul style="margin:0;">
            <li>$f'$ 由 $+$ 变 $-$：$c$ 是<strong>极大值点</strong>（先升后降，山顶）</li>
            <li>$f'$ 由 $-$ 变 $+$：$c$ 是<strong>极小值点</strong>（先降后升，山谷）</li>
            <li>$f'$ 不变号：$c$ <strong>不是</strong>极值点</li>
          </ul>
        </div>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做一道</h3>
        <p>求 $f(x) = x^3 - 3x$ 的所有极值。</p>
        <p>这就是上一节用过的函数，已知驻点是 $x = \\pm 1$。</p>

        <h3 class="serif text-xl font-semibold mt-2 mb-3">核心思路</h3>
        <p>"相关变化率"问题的共同结构：</p>
        <ol style="list-style:decimal;padding-left:1.5em;">
          <li>有几个变量随时间 $t$ 同时变化</li>
          <li>它们之间满足某个<strong>静态关系</strong>（几何/物理公式）</li>
          <li>已知一个变量的变化率，要求另一个变量的变化率</li>
        </ol>
        <p>解法核心：把静态关系<strong>对时间 $t$ 求导</strong>。每个变量都看作 $t$ 的函数，所以求导时要用<strong>链式法则</strong>（每个变量后跟个 $\\dfrac{d\\text{变量}}{dt}$）。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">标准五步法</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">

            <li>列出已知变化率（用 $\\dfrac{d?}{dt}$ 表示）和要求的</li>
            <li>写出变量间的<strong>关系式</strong>（几何/物理公式）</li>
            <li>两边对 $t$ 求导（链式法则！）</li>
            <li><strong>最后</strong>代入数值</li>
          </ol>
        </div>
        <p>关键：<strong>不要太早代数值</strong>。让方程保持字母形式直到求导完毕——否则导数会出错。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">经典题：球膨胀</h3>
        <p><strong>问题</strong>：一个球以 $5$ 立方厘米/秒的速度被吹气。当半径为 $4$ 厘米时，半径增长率是多少？</p>
        <p><strong>第 1 步</strong>：变量 $r$（半径），$V$（体积）。</p>
        <p><strong>第 2 步</strong>：已知 $\\dfrac{dV}{dt} = 5$；求 $\\dfrac{dr}{dt}$（在 $r = 4$ 时）。</p>
        <p><strong>第 3 步</strong>：球的体积公式 $V = \\dfrac{4}{3}\\pi r^3$。</p>
        <p><strong>第 4 步</strong>：两边对 $t$ 求导（$r$ 是 $t$ 的函数，用链式法则）：</p>
        <p>$$\\frac{dV}{dt} = 4\\pi r^2 \\cdot \\frac{dr}{dt}.$$</p>
        <p><strong>第 5 步</strong>：代入 $\\dfrac{dV}{dt} = 5$，$r = 4$：</p>
        <p>$$5 = 4\\pi \\cdot 16 \\cdot \\frac{dr}{dt} = 64\\pi \\cdot \\frac{dr}{dt}.$$</p>
        <p>解得 $\\dfrac{dr}{dt} = \\dfrac{5}{64\\pi} \\approx 0.025$ 厘米/秒。</p>
        <p>注意：随着 $r$ 变大，半径的<strong>增长率会越来越慢</strong>（公式里 $r^2$ 在分母）——直觉对：大球增大半径需要"更多"体积。</p>

        <p><strong>设</strong>：$x$ = 底部到墙的距离，$y$ = 顶部到地面的高度。已知 $\\dfrac{dx}{dt} = 1$，求 $\\dfrac{dy}{dt}$（在 $x = 3$ 时）。</p>
        <p><strong>关系式</strong>（勾股定理）：$x^2 + y^2 = 25$。</p>
        <p><strong>对 $t$ 求导</strong>：$2x \\cdot \\dfrac{dx}{dt} + 2y \\cdot \\dfrac{dy}{dt} = 0$。</p>
        <p><strong>代数值</strong>：$x = 3$ 时，$y = \\sqrt{25 - 9} = 4$。</p>
        <p>$$2(3)(1) + 2(4) \\cdot \\frac{dy}{dt} = 0 \\Rightarrow \\frac{dy}{dt} = -\\frac{6}{8} = -0.75.$$</p>
        <p>负号表示 $y$ 在<strong>减小</strong>——顶部以 $0.75$ 米/秒往下滑。</p>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：相关变化率题<strong>看起来吓人但模板固定</strong>——五步走死磕。<strong>最常错</strong>的是第 5 步顺序——先求导后代值，反过来错。看到求导式子里出现 $\\dfrac{d}{dt}(r^3) = 3r^2 \\cdot \\dfrac{dr}{dt}$ 这种链式结果是对的，没有 $\\dfrac{dr}{dt}$ 的话就漏了链式法则。
        </div>

    hook: '切线在切点附近"贴"得很紧——可以用直线代替曲线做近似。这是 200 多年前没有计算器时代的"神器"，但它揭示的<strong>本质思想</strong>（局部用线性逼近非线性）至今仍是工程、机器学习等领域的核心。',

        <h3 class="serif text-xl font-semibold mt-2 mb-3">什么是微分</h3>
        <p>对函数 $y = f(x)$，给一个微小变化 $dx$（自变量改变量），相应的 $y$ 改变量近似为：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$dy = f'(x) \\, dx.$$
        </div>
        <p>这里 $dy$ 叫做<strong>微分</strong>（differential）。它<strong>不是</strong> $\\Delta y$（实际改变量），而是切线上对应的改变量。</p>
        <p>区别：</p>
        <ul>
          <li>$\\Delta y = f(x + \\Delta x) - f(x)$ —— 函数实际的改变（沿曲线）</li>
          <li>$dy = f'(x) \\, dx$ —— 切线上对应的改变（沿切线）</li>
        </ul>
        <p>当 $\\Delta x$ 很小时 $\\Delta y \\approx dy$——这是核心。</p>

        <p>把上面写成"用 $a$ 附近的切线代替函数"的形式：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">

      ` },

        <h3 class="serif text-xl font-semibold mt-8 mb-3">为什么这件事重要</h3>

        <p>这就是为什么导数（线性逼近的斜率）能描述这么多复杂现象。物理（牛顿力学的瞬时速度）、工程（误差分析）、机器学习（梯度下降，本质就是反复用线性近似找最优）——都建立在这个思想上。</p>

  {
    id: 24, module: 'M5', title: '不定积分：导数的逆运算',
    hook: '你已经学会了"给曲线求斜率"（求导）。现在反过来问：如果我告诉你每一点的斜率，你能还原出那条曲线吗？这就是积分——导数的"逆操作"。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">从速度还原位置</h3>
        <p>导数的故事是"已知位置 $s(t)$，求速度 $v(t) = s'(t)$"。现在反过来：</p>
        <p><strong>已知速度 $v(t) = 2t$（匀加速），求位置 $s(t)$。</strong></p>
        <p>我们需要找一个函数，它的导数恰好是 $2t$。你想一下——哪个函数求导后得 $2t$？</p>
        <p>答案是 $t^2$，因为 $(t^2)' = 2t$。</p>
        <p>但等等——$t^2 + 1$ 的导数也是 $2t$，$t^2 + 100$ 也是，$t^2 - 3.7$ 也是。<strong>加一个常数并不影响导数</strong>（常数的导数为零）。</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          <strong>原函数不唯一</strong>：如果 $F'(x) = f(x)$，那么 $F(x) + C$（$C$ 为任意常数）的导数也是 $f(x)$。所有原函数之间只差一个竖直平移。
        </div>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">不定积分的定义</h3>
        <p>我们把"找原函数"这件事记作：</p>
        <p>$$\\int f(x)\\,dx = F(x) + C$$</p>
        <p>其中 $F'(x) = f(x)$，$C$ 是<strong>任意常数</strong>（积分常数）。</p>
        <p>各部分含义：</p>
        <ul>
          <li>$\\int$ ——积分号，拉丁字母 S 的拉长，代表"求和"（Sum）</li>
          <li>$f(x)$ ——被积函数（已知的东西）</li>
          <li>$dx$ ——指明自变量是 $x$</li>
          <li>$F(x) + C$ ——原函数族</li>
        </ul>
        <p>所以 $\\int 2t\\,dt = t^2 + C$，因为 $(t^2 + C)' = 2t$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">验证：求完积分怎么确认？</h3>
        <p>积分和求导互逆。所以：<strong>把你的答案求导一下，如果得回被积函数，就对了。</strong></p>
        <p>例如，你声称 $\\int \\cos x\\,dx = \\sin x + C$。验证：$(\\sin x + C)' = \\cos x$。✓</p>
        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：积分比求导难得多。求导有机械化的公式和链式法则，总能算出来。但积分很多时候需要"猜"——猜一个函数，验证它的导数对不对。后面几节学的各种技巧（换元、分部），本质上都是帮你"更聪明地猜"。
        </div>
      ` },

  {
    id: 25, module: 'M5', title: '基本积分公式',
    hook: '求导有公式表，积分自然也有。好消息：积分公式本质就是"把求导公式反过来读"——你已经会了 80%。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">"反读"求导公式</h3>
        <p>求导时你背了 $(x^n)' = nx^{n-1}$。反过来读：什么函数求导得 $x^n$？答案是 $\\dfrac{x^{n+1}}{n+1}$（验证：$\\left(\\dfrac{x^{n+1}}{n+1}\\right)' = x^n$）。</p>
        <p>用同样的思路，把每条求导公式"翻转"，就得到积分公式表。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">核心公式表</h3>
        <p><strong>幂函数</strong>（最常用）：</p>
        <p>$$\\int x^n\\,dx = \\frac{x^{n+1}}{n+1} + C \\quad (n \\neq -1)$$</p>
        <p>特别地：$\\int 1\\,dx = x + C$（$n = 0$），$\\int x\\,dx = \\dfrac{x^2}{2} + C$（$n = 1$）。</p>
        <p>当 $n = -1$ 时例外：$\\int \\dfrac{1}{x}\\,dx = \\ln|x| + C$。</p>

        <p style="margin-top:1.2em;"><strong>三角函数</strong>：</p>
        <p>$$\\int \\sin x\\,dx = -\\cos x + C, \\quad \\int \\cos x\\,dx = \\sin x + C$$</p>
        <p>$$\\int \\sec^2 x\\,dx = \\tan x + C, \\quad \\int \\csc^2 x\\,dx = -\\cot x + C$$</p>

        <p style="margin-top:1.2em;"><strong>指数与对数</strong>：</p>
        <p>$$\\int e^x\\,dx = e^x + C, \\quad \\int a^x\\,dx = \\frac{a^x}{\\ln a} + C$$</p>

        <p style="margin-top:1.2em;"><strong>反三角</strong>：</p>
        <p>$$\\int \\frac{1}{\\sqrt{1-x^2}}\\,dx = \\arcsin x + C, \\quad \\int \\frac{1}{1+x^2}\\,dx = \\arctan x + C$$</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">线性性质</h3>
        <p>和求导一样，积分对加减和常数倍"守规矩"：</p>
        <p>$$\\int [f(x) \\pm g(x)]\\,dx = \\int f(x)\\,dx \\pm \\int g(x)\\,dx$$</p>
        <p>$$\\int k f(x)\\,dx = k \\int f(x)\\,dx \\quad (k \\text{ 为常数})$$</p>
        <p>这意味着多项式可以<strong>逐项积分</strong>：</p>
        <p>$$\\int (3x^2 + 2x - 5)\\,dx = x^3 + x^2 - 5x + C.$$</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起做一道</h3>
        <p>求 $\\int \\left(\\sqrt{x} + \\dfrac{1}{x^2}\\right)dx$。</p>
        <p><strong>第 1 步</strong>，改写成幂函数：$\\sqrt{x} = x^{1/2}$，$\\dfrac{1}{x^2} = x^{-2}$。</p>
        <p><strong>第 2 步</strong>，逐项套幂函数公式：</p>
        <p>$$\\int x^{1/2}\\,dx = \\frac{x^{3/2}}{3/2} = \\frac{2}{3}x^{3/2}$$</p>
        <p>$$\\int x^{-2}\\,dx = \\frac{x^{-1}}{-1} = -\\frac{1}{x}$$</p>
        <p><strong>答</strong>：$\\dfrac{2}{3}x^{3/2} - \\dfrac{1}{x} + C$。</p>
        <p>验证：$\\left(\\dfrac{2}{3}x^{3/2} - x^{-1}\\right)' = \\dfrac{2}{3} \\cdot \\dfrac{3}{2} x^{1/2} + x^{-2} = \\sqrt{x} + \\dfrac{1}{x^2}$。✓</p>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>记忆诀窍</strong>：幂函数公式只有一条——"指数加 1，除以新指数"。唯一例外是 $n = -1$（$\\int 1/x = \\ln|x|$）。三角和指数的记忆：把求导公式表翻过来看就行，注意正负号。
        </div>
      ` },

  {
    id: 26, module: 'M5', title: '第一类换元法（凑微分）',
    hook: '公式表只能处理"长得规规矩矩"的函数。可现实中的被积函数常常是复合函数——$\\sin(3x)$、$e^{2x}$、$\\sqrt{1+x^2} \\cdot x$。怎么办？换元法就是"把复杂的内层换个名字，回到公式表"。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">核心思想：链式法则的逆运算</h3>
        <p>回忆链式法则：$[F(g(x))]' = F'(g(x)) \\cdot g'(x)$。</p>
        <p>反过来读：<strong>如果被积函数恰好长成 $f(g(x)) \\cdot g'(x)$ 的模样</strong>，那么它的原函数就是 $F(g(x))$（其中 $F' = f$）。</p>
        <p>$$\\int f(g(x)) \\cdot g'(x)\\,dx = F(g(x)) + C.$$</p>
        <p>这就是<strong>换元公式</strong>。实际操作时，令 $u = g(x)$，则 $du = g'(x)\\,dx$，代入后变成：</p>
        <p>$$\\int f(u)\\,du = F(u) + C.$$</p>
        <p>内层函数"换了个名字 $u$"之后，问题就回到了基本公式表。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">操作步骤</h3>
        <p><strong>第 1 步</strong>：观察被积函数，找出一个"内层"$u = g(x)$，使得 $g'(x)$ 也出现在被积式里（或者差一个常数倍）。</p>
        <p><strong>第 2 步</strong>：令 $u = g(x)$，算出 $du = g'(x)\\,dx$，把式子里所有 $x$ 替换掉。</p>
        <p><strong>第 3 步</strong>：对 $u$ 用基本公式求积分。</p>
        <p><strong>第 4 步</strong>：把 $u = g(x)$ 代回去。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">例题详解</h3>
        <p><strong>例 1</strong>：求 $\\int \\cos(3x)\\,dx$。</p>
        <p>观察：内层 $u = 3x$，$du = 3\\,dx$，即 $dx = \\dfrac{du}{3}$。</p>
        <p>代入：$\\int \\cos u \\cdot \\dfrac{du}{3} = \\dfrac{1}{3}\\sin u + C = \\dfrac{1}{3}\\sin(3x) + C$。</p>
        <p>验证：$\\left(\\dfrac{1}{3}\\sin(3x)\\right)' = \\dfrac{1}{3} \\cdot \\cos(3x) \\cdot 3 = \\cos(3x)$。✓</p>

        <p style="margin-top:1.4em;"><strong>例 2</strong>：求 $\\int x \\cdot e^{x^2}\\,dx$。</p>
        <p>观察：内层 $u = x^2$，$du = 2x\\,dx$。被积式里有 $x\\,dx = \\dfrac{1}{2}du$。</p>
        <p>代入：$\\int e^u \\cdot \\dfrac{1}{2}\\,du = \\dfrac{1}{2}e^u + C = \\dfrac{1}{2}e^{x^2} + C$。</p>

        <p style="margin-top:1.4em;"><strong>例 3</strong>：求 $\\int \\dfrac{x}{\\sqrt{1 + x^2}}\\,dx$。</p>
        <p>令 $u = 1 + x^2$，$du = 2x\\,dx$，$x\\,dx = \\dfrac{du}{2}$。</p>
        <p>$\\int \\dfrac{1}{\\sqrt{u}} \\cdot \\dfrac{du}{2} = \\dfrac{1}{2}\\int u^{-1/2}\\,du = \\dfrac{1}{2} \\cdot 2u^{1/2} + C = \\sqrt{1 + x^2} + C$。</p>

        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          <strong>找 $u$ 的直觉</strong>：看看谁是"被嵌套"的那一层（出现在 $\\sin(\\cdot), e^{(\\cdot)}, (\\cdot)^n, \\ln(\\cdot)$ 的括号里）。如果它的导数也在式子里晃悠，那就是你的 $u$。
        </div>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：换元法的难点不在"代入"这步，而在<strong>观察——选哪个做 $u$</strong>。选错了会越换越复杂。一个好的信号是：选完 $u$ 之后，$du$ 里包含的 $x$ 部分能把被积式里剩余的 $x$ 项"吃掉"，只剩 $u$。
        </div>
      ` },

  {
    id: 27, module: 'M5', title: '分部积分法',
    hook: '换元法对付的是"复合函数"。但有时被积函数是两个不同类型的东西<strong>相乘</strong>——比如 $x \\cdot e^x$、$x \\cdot \\sin x$、$\\ln x$。这时候需要另一件武器：分部积分，本质是乘法法则的逆运算。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">从乘法法则到分部公式</h3>
        <p>乘法法则：$(uv)' = u'v + uv'$。</p>
        <p>两边积分：$uv = \\int u'v\\,dx + \\int uv'\\,dx$。</p>
        <p>移项得到<strong>分部积分公式</strong>：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          $$\\int u\\,dv = uv - \\int v\\,du$$
        </div>
        <p>它的含义：原来的积分 $\\int u\\,dv$ 算不出来，但"转嫁"一下（$u$ 变成 $du$，$dv$ 变成 $v$），得到一个新积分 $\\int v\\,du$，也许这个新的就好算了。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">怎么选 $u$ 和 $dv$？</h3>
        <p>诀窍：<strong>让 $u$ 求导后更简单，让 $dv$ 积分后不更复杂</strong>。记一个优先级口诀：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          <strong>LIATE</strong>：$u$ 的优先级从高到低——<br/>
          <strong>L</strong>og（对数）> <strong>I</strong>nverse trig（反三角）> <strong>A</strong>lgebraic（多项式）> <strong>T</strong>rig（三角）> <strong>E</strong>xponential（指数）
        </div>
        <p>排在前面的更适合做 $u$（因为它们求导会变简单），排在后面的做 $dv$（因为它们积分还是自己）。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">例题详解</h3>
        <p><strong>例 1</strong>：求 $\\int x e^x\\,dx$。</p>
        <p>按 LIATE：$x$（代数）排在 $e^x$（指数）前面。所以：</p>
        <ul>
          <li>$u = x$，$du = dx$</li>
          <li>$dv = e^x\\,dx$，$v = e^x$</li>
        </ul>
        <p>套公式：$\\int x e^x\\,dx = x e^x - \\int e^x\\,dx = x e^x - e^x + C = e^x(x - 1) + C$。</p>
        <p>验证：$[e^x(x-1)]' = e^x(x-1) + e^x = xe^x$。✓</p>

        <p style="margin-top:1.4em;"><strong>例 2</strong>：求 $\\int \\ln x\\,dx$。</p>
        <p>只有一个函数？没关系——把 $1$ 当作 $dv$。</p>
        <ul>
          <li>$u = \\ln x$，$du = \\dfrac{1}{x}dx$</li>
          <li>$dv = dx$，$v = x$</li>
        </ul>
        <p>$\\int \\ln x\\,dx = x\\ln x - \\int x \\cdot \\dfrac{1}{x}\\,dx = x\\ln x - \\int 1\\,dx = x\\ln x - x + C$。</p>

        <p style="margin-top:1.4em;"><strong>例 3</strong>：求 $\\int x^2 \\sin x\\,dx$（需要两次分部）。</p>
        <p>第一次：$u = x^2, dv = \\sin x\\,dx \\Rightarrow du = 2x\\,dx, v = -\\cos x$。</p>
        <p>$= -x^2\\cos x + \\int 2x\\cos x\\,dx$。</p>
        <p>第二次：$u = 2x, dv = \\cos x\\,dx \\Rightarrow du = 2\\,dx, v = \\sin x$。</p>
        <p>$= -x^2\\cos x + 2x\\sin x - \\int 2\\sin x\\,dx = -x^2\\cos x + 2x\\sin x + 2\\cos x + C$。</p>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>何时用分部</strong>：被积函数是"两种不同类型相乘"且换元搞不定时。典型场景：$x^n e^x$、$x^n \\sin x$、$x^n \\cos x$、$x^n \\ln x$、$e^x \\sin x$。
        </div>
      ` },
      { type: 'viz', id: 'viz-l27', label: '分部积分的"转嫁"过程' },
    ],

      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-8 mb-3">黎曼和的公式</h3>
        <p>把 $[a, b]$ 均分成 $n$ 段，每段宽度 $\\Delta x = \\dfrac{b-a}{n}$。取第 $i$ 段右端点 $x_i = a + i \\cdot \\Delta x$。</p>
        <p>$$S_n = \\sum_{i=1}^{n} f(x_i) \\cdot \\Delta x$$</p>
        <p>当 $n \\to \\infty$ 时，如果极限存在，就是<strong>定积分</strong>：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          $$\\int_a^b f(x)\\,dx = \\lim_{n \\to \\infty} \\sum_{i=1}^{n} f(x_i)\\,\\Delta x$$
        </div>
        <p>符号含义：$a, b$ 是积分的<strong>下限</strong>和<strong>上限</strong>。和不定积分最大的区别：<strong>定积分是一个数</strong>（面积），不定积分是一个函数族。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">关于正负面积</h3>
        <p>当 $f(x) < 0$ 时，矩形高度为负——算出来的面积带<strong>负号</strong>。</p>
        <p>$$\\int_a^b f(x)\\,dx = (x\\text{ 轴以上的面积}) - (x\\text{ 轴以下的面积})$$</p>
        <p>这不是 bug，是 feature——它让定积分具有"方向性"，在物理中对应位移（不是路程）。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">基本性质</h3>
        <p>$$\\int_a^a f(x)\\,dx = 0, \\quad \\int_a^b f(x)\\,dx = -\\int_b^a f(x)\\,dx$$</p>
        <p>$$\\int_a^b f(x)\\,dx + \\int_b^c f(x)\\,dx = \\int_a^c f(x)\\,dx$$</p>
        <p>第三条像是"拼接面积"——$[a,b]$ 的面积加上 $[b,c]$ 的面积等于 $[a,c]$ 的面积。非常直觉。</p>

  {
    id: 29, module: 'M5', title: '微积分基本定理',
    hook: '这是整个微积分中<strong>最深刻的结论</strong>——导数（瞬时变化率）和积分（累积面积）看似毫无关系，却被一条定理优雅地串连：<strong>积分就是反导数在端点的差</strong>。从此，算面积再也不用切无穷多矩形了。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">定理的陈述</h3>
        <p>设 $f$ 在 $[a,b]$ 上连续，$F$ 是 $f$ 的任一原函数（$F' = f$），则：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          $$\\int_a^b f(x)\\,dx = F(b) - F(a)$$
        </div>
        <p>通常记作 $F(x)\\Big|_a^b = F(b) - F(a)$。</p>
        <p><strong>翻译成人话</strong>：要算曲线下面积，只需找原函数 $F$，然后用"上限的值减去下限的值"。不需要切矩形，不需要求极限——一步到位。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">为什么 $+C$ 不再出现？</h3>
        <p>因为 $F(b) - F(a)$ 会把常数抵消掉：$(F(b) + C) - (F(a) + C) = F(b) - F(a)$。不管你选哪个原函数，结果都一样。<strong>定积分是唯一确定的数。</strong></p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">一起算几道</h3>
        <p><strong>例 1</strong>：$\\int_0^1 x^2\\,dx$。</p>
        <p>原函数：$F(x) = \\dfrac{x^3}{3}$。</p>
        <p>$F(1) - F(0) = \\dfrac{1}{3} - 0 = \\dfrac{1}{3}$。</p>
        <p>所以 $y = x^2$ 在 $[0,1]$ 上围成的面积是 $\\dfrac{1}{3}$。</p>

        <p style="margin-top:1.4em;"><strong>例 2</strong>：$\\int_0^{\\pi} \\sin x\\,dx$。</p>
        <p>原函数：$F(x) = -\\cos x$。</p>
        <p>$F(\\pi) - F(0) = -\\cos\\pi - (-\\cos 0) = -(-1) + 1 = 2$。</p>
        <p>一个正弦"拱"的面积恰好是 $2$——漂亮的数字。</p>

        <p style="margin-top:1.4em;"><strong>例 3</strong>：$\\int_1^e \\dfrac{1}{x}\\,dx$。</p>
        <p>原函数：$F(x) = \\ln x$。</p>
        <p>$\\ln e - \\ln 1 = 1 - 0 = 1$。</p>
        <p>$y = 1/x$ 从 $1$ 到 $e$ 下方的面积恰好是 $1$——这是 $e$ 的另一种定义方式。</p>
      ` },

      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-8 mb-3">定理的"另一半"</h3>
        <p>基本定理其实有两部分。上面那条（牛顿—莱布尼茨公式）用于<strong>计算</strong>。另一半更偏理论，但同样美妙：</p>
        <p>定义<strong>面积累积函数</strong>：$A(x) = \\int_a^x f(t)\\,dt$（从 $a$ 积到可变上限 $x$）。</p>

  {
    id: 30, module: 'M5', title: '定积分的计算技巧',
    hook: '有了基本定理，定积分的核心步骤是"找原函数 → 代端点"。但找原函数时可以用换元和分部——它们在定积分中有一些额外的技巧和简化。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">定积分的换元</h3>
        <p>和不定积分一样令 $u = g(x)$，但<strong>上下限要跟着换</strong>——不需要换回 $x$。</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-3">
          $$\\int_a^b f(g(x)) \\cdot g'(x)\\,dx = \\int_{g(a)}^{g(b)} f(u)\\,du$$
        </div>

        <p><strong>例</strong>：$\\int_0^1 2x \\cdot e^{x^2}\\,dx$。</p>
        <p>令 $u = x^2$，$du = 2x\\,dx$。上下限：$x=0 \\Rightarrow u=0$，$x=1 \\Rightarrow u=1$。</p>
        <p>$= \\int_0^1 e^u\\,du = e^u\\Big|_0^1 = e - 1$。</p>
        <p>注意：换完之后直接对 $u$ 积分并代 $u$ 的上下限，<strong>不用换回 $x$</strong>。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">定积分的分部</h3>
        <p>$$\\int_a^b u\\,dv = \\left[uv\\right]_a^b - \\int_a^b v\\,du$$</p>
        <p><strong>例</strong>：$\\int_0^1 x e^x\\,dx$。</p>
        <p>$u = x, dv = e^x dx$，$v = e^x, du = dx$。</p>
        <p>$= [xe^x]_0^1 - \\int_0^1 e^x\\,dx = (1 \\cdot e - 0) - [e^x]_0^1 = e - (e - 1) = 1$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">奇偶性的妙用</h3>
        <p>当积分区间<strong>关于原点对称</strong>（即 $[-a, a]$）时：</p>
        <ul>
          <li><strong>偶函数</strong>（$f(-x) = f(x)$）：$\\int_{-a}^a f(x)\\,dx = 2\\int_0^a f(x)\\,dx$</li>
          <li><strong>奇函数</strong>（$f(-x) = -f(x)$）：$\\int_{-a}^a f(x)\\,dx = 0$</li>
        </ul>
        <p><strong>例</strong>：$\\int_{-1}^1 x^3\\,dx = 0$（$x^3$ 是奇函数，对称区间直接为零）。</p>
        <p>$\\int_{-1}^1 (x^4 + x^3)\\,dx = \\int_{-1}^1 x^4\\,dx + 0 = 2\\int_0^1 x^4\\,dx = 2 \\cdot \\dfrac{1}{5} = \\dfrac{2}{5}$。</p>
        <p>利用奇偶性，一半的计算量瞬间消失。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">总结：定积分计算流程</h3>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          <ol style="margin:0;padding-left:1.2em;">
            <li><strong>先看</strong>：奇偶性能不能直接简化？</li>
            <li><strong>再找原函数</strong>：能查表就查表；复合函数用换元；两类相乘用分部。</li>
            <li><strong>最后代端点</strong>：$F(b) - F(a)$。注意换元时上下限要跟着变。</li>
          </ol>
        </div>

        <div class="rounded-md p-4 my-5" style="background:#fdf6ec;border:1px solid #ead9b5;">
          <strong>经验之谈</strong>：定积分的换元比不定积分<strong>更爽</strong>——因为你可以直接换上下限，不用在最后费劲把 $u$ 换回 $x$。养成习惯：做定积分换元时，第一时间把新上下限写在积分号上。
        </div>
      ` },
      { type: 'viz', id: 'viz-l30', label: '奇函数在对称区间 $[-a,a]$ 上面积互相抵消' },
    ],

    hook: '上一模块我们算的是"曲线和 $x$ 轴围成的面积"。但现实问题更常见的是：两条曲线之间夹着多大的区域？方法几乎一样——上面减下面，再积分。',
    sections: [
      { type: 'text', html: `
        <h3 class="serif text-xl font-semibold mt-2 mb-3">核心思想："上减下"</h3>
        <p>两条曲线 $y = f(x)$（上方）和 $y = g(x)$（下方）在 $[a, b]$ 上围成的面积：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          $$A = \\int_a^b [f(x) - g(x)]\\,dx$$
        </div>
        <p>直觉：在每个 $x$ 处，竖直的"条带"高度是 $f(x) - g(x)$，宽度 $dx$。把所有条带加起来就是面积。</p>
        <p>当只有一条曲线和 $x$ 轴时，$g(x) = 0$，就回到了 $\\int_a^b f(x)\\,dx$ ——之前的情形是这个的特例。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">操作步骤</h3>
        <p><strong>第 1 步</strong>：找交点——解 $f(x) = g(x)$，确定积分上下限 $a, b$。</p>
        <p><strong>第 2 步</strong>：判断谁在上面——在 $[a,b]$ 内取个测试点比较 $f$ 和 $g$ 的大小。</p>
        <p><strong>第 3 步</strong>：积分 $\\int_a^b (\\text{上} - \\text{下})\\,dx$。</p>

        <h3 class="serif text-xl font-semibold mt-8 mb-3">例题详解</h3>
        <p><strong>例 1</strong>：求 $y = x^2$ 与 $y = x$ 围成的面积。</p>
        <p>第 1 步，交点：$x^2 = x \\Rightarrow x(x-1) = 0 \\Rightarrow x = 0, 1$。</p>
        <p>第 2 步，谁上谁下？取 $x = 0.5$：$f(0.5) = 0.5$，$g(0.5) = 0.25$。$y = x$ 在上方。</p>
        <p>第 3 步：</p>
        <p>$$A = \\int_0^1 (x - x^2)\\,dx = \\left[\\frac{x^2}{2} - \\frac{x^3}{3}\\right]_0^1 = \\frac{1}{2} - \\frac{1}{3} = \\frac{1}{6}.$$</p>

        <h3 class="serif text-xl font-semibold mt-2 mb-3">从勾股定理到弧长公式</h3>
        <p>一小段曲线，水平走了 $dx$，竖直走了 $dy$。这一小段的长度（近似为直线）：</p>
        <p>$$ds = \\sqrt{dx^2 + dy^2} = \\sqrt{1 + \\left(\\frac{dy}{dx}\\right)^2}\\,dx = \\sqrt{1 + [f'(x)]^2}\\,dx$$</p>
        <p>把所有小段加起来：</p>
        <div class="rounded-md bg-[var(--accent-soft)] border-l-[3px] border-[var(--accent)] p-4 my-5">
          $$L = \\int_a^b \\sqrt{1 + [f'(x)]^2}\\,dx$$
        </div>
        <p>这就是<strong>弧长公式</strong>。本质就是"微小勾股定理的积分"。</p>

        <p>工程和科学的解决方案：<strong>用数值方法近似到任意精度</strong>。</p>

    'viz-l11': () => {

    'viz-l12': () => {

      const keys = Object.keys(funcs);

    'viz-l13': () => {

        xMin: -2, xMax: 2, yMin: -1, yMax: 4,
        width: 270, height: 220,
        title: '偶函数：左右面积相等',
      });
      container.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0.5em;">
          <div>${svg1}
            <p style="font-size:0.8em;color:#666;text-align:center;">$\\int_{-a}^a x^3\\,dx = 0$</p>
          </div>
          <div>${svg2}
            <p style="font-size:0.8em;color:#666;text-align:center;">$\\int_{-a}^a x^2\\,dx = 2\\int_0^a x^2\\,dx$</p>
          </div>
        </div>`;
      renderAllMath(container);
    },

    // ============== M6 Visualizations ==============
    'viz-l31': () => {
      const f = x => x;
      const g = x => x * x;
      const padL = 38, padR = 14, padT = 14, padB = 28;
      const width = 560, height = 320;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const xMin = -0.3, xMax = 1.5, yMin = -0.3, yMax = 1.5;
      const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
      const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

      let fill = `M${sx(0).toFixed(1)},${sy(0).toFixed(1)}`;
      for (let i = 0; i <= 60; i++) {
        const xi = i / 60;
        fill += ` L${sx(xi).toFixed(1)},${sy(f(xi)).toFixed(1)}`;
      }
      for (let i = 60; i >= 0; i--) {
        const xi = i / 60;
        fill += ` L${sx(xi).toFixed(1)},${sy(g(xi)).toFixed(1)}`;
      }
      fill += ' Z';
      const areaPath = `<path d="${fill}" fill="rgba(44,74,122,0.15)" stroke="none"/>`;

      const svg = svgPlot({
        fn: [
          {fn: f, color: '#2c4a7a', label: 'y = x（上）'},
          {fn: g, color: '#b04030', label: 'y = x²（下）'},
        ],
        xMin, xMax, yMin, yMax,
        extras: [areaPath],
        points: [{x: 0, y: 0, color: '#666', label: '(0,0)'}, {x: 1, y: 1, color: '#666', label: '(1,1)'}],
      });
      container.innerHTML = `
        <div class="viz-svg">${svg}</div>
        <p style="font-size:0.85em;color:#666;margin-top:0.5em;">阴影 = $\\int_0^1(x - x^2)\\,dx = 1/6$。"上减下"再积分。</p>`;
      renderAllMath(container);
    },

    'viz-l32': () => {
      let n = 10;
      const f = x => Math.sqrt(x);
      const draw = () => {
        const padL = 38, padR = 14, padT = 14, padB = 28;
        const width = 560, height = 320;
        const plotW = width - padL - padR;
        const plotH = height - padT - padB;
        const xMin = -0.3, xMax = 4.5, yMin = -2.5, yMax = 2.5;
        const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
        const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

        let disks = '';
        const dx = 4 / n;
        for (let i = 0; i < n; i++) {
          const xi = (i + 0.5) * dx;
          const r = f(xi);
          const cx = sx(xi);
          const ry = Math.abs(sy(0) - sy(r));
          const rx = Math.abs(sx(dx/2) - sx(0)) * 0.8;
          disks += `<ellipse cx="${cx}" cy="${sy(0)}" rx="${rx}" ry="${ry}" fill="rgba(44,74,122,0.1)" stroke="#2c4a7a" stroke-width="0.8"/>`;
        }

        const svg = svgPlot({
          fn: [
            {fn: f, color: '#2c4a7a', label: 'y = √x'},
            {fn: x => -f(x), color: '#2c4a7a', dashed: true},
          ],
          xMin, xMax, yMin, yMax,
          extras: [disks],
        });
        container.querySelector('.viz-svg').innerHTML = svg;
        container.querySelector('.viz-readout').innerHTML =
          `圆盘数 = <strong>${n}</strong> &nbsp;|&nbsp; $V = \\pi\\int_0^4 x\\,dx = 8\\pi \\approx 25.13$`;
      };
      container.innerHTML = `
        <div class="viz-svg"></div>
        <div class="viz-controls">
          <span style="font-size:0.85em;color:#666;">圆盘数:</span>
          <input type="range" min="3" max="30" step="1" value="${n}">
        </div>
        <div class="viz-readout" style="font-size:0.85em;color:#666;font-family:ui-monospace,monospace;margin-top:0.4em;"></div>
        <p style="font-size:0.85em;color:#666;margin-top:0.5em;">$y = \\sqrt{x}$ 绕 $x$ 轴旋转。每个椭圆代表一个圆盘截面（侧视图）。</p>`;
      container.querySelector('input').oninput = e => { n = parseInt(e.target.value); draw(); };
      draw();
      renderAllMath(container);
    },

    'viz-l33': () => {
      const f = x => x * x;
      const fp = x => 2 * x;
      const padL = 38, padR = 14, padT = 14, padB = 28;
      const width = 560, height = 320;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;
      const xMin = -0.5, xMax = 1.5, yMin = -0.3, yMax = 1.5;
      const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
      const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

      const x0 = 0.6;
      const dx = 0.3;
      const x1 = x0 + dx;
      const y0 = f(x0), y1 = f(x1);
      const dxPx = sx(x1) - sx(x0);
      const dyPx = sy(y0) - sy(y1);

      const triangle = `
        <line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x1)}" y2="${sy(y0)}" stroke="#b04030" stroke-width="1.5"/>
        <line x1="${sx(x1)}" y1="${sy(y0)}" x2="${sx(x1)}" y2="${sy(y1)}" stroke="#b04030" stroke-width="1.5"/>
        <line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x1)}" y2="${sy(y1)}" stroke="#b04030" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="${(sx(x0)+sx(x1))/2}" y="${sy(y0)+16}" font-size="11" fill="#b04030" text-anchor="middle">dx</text>
        <text x="${sx(x1)+14}" y="${(sy(y0)+sy(y1))/2}" font-size="11" fill="#b04030" text-anchor="start">dy</text>
        <text x="${(sx(x0)+sx(x1))/2 - 15}" y="${(sy(y0)+sy(y1))/2 - 8}" font-size="11" fill="#b04030">ds</text>
      `;

      const svg = svgPlot({
        fn: [{fn: f, color: '#2c4a7a', label: 'y = x²'}],
        xMin, xMax, yMin, yMax,
        extras: [triangle],
        points: [{x: x0, y: y0, color: '#2c4a7a'}, {x: x1, y: y1, color: '#2c4a7a'}],
      });
      container.innerHTML = `
        <div class="viz-svg">${svg}</div>
        <p style="font-size:0.85em;color:#666;margin-top:0.5em;">红色直角三角形：水平 $dx$，垂直 $dy = f'(x)\\,dx$，斜边 $ds = \\sqrt{dx^2 + dy^2}$。弧长 = 所有 $ds$ 的总和。</p>`;
      renderAllMath(container);
    },

    'viz-l34': () => {
      let k = 100;
      let d = 0.3;
      const draw = () => {
        const padL = 38, padR = 14, padT = 14, padB = 28;
        const width = 560, height = 280;
        const plotW = width - padL - padR;
        const plotH = height - padT - padB;
        const xMin = -0.05, xMax = 0.5, yMin = -5, yMax = 55;
        const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
        const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

        let fill = `M${sx(0).toFixed(1)},${sy(0).toFixed(1)}`;
        const steps = 50;
        for (let i = 0; i <= steps; i++) {
          const xi = (i / steps) * d;
          fill += ` L${sx(xi).toFixed(1)},${sy(k*xi).toFixed(1)}`;
        }
        fill += ` L${sx(d).toFixed(1)},${sy(0).toFixed(1)} Z`;
        const areaPath = `<path d="${fill}" fill="rgba(44,74,122,0.15)" stroke="none"/>`;

        const svg = svgPlot({
          fn: [{fn: x => k*x, color: '#2c4a7a', label: `F(x) = ${k}x`}],
          xMin, xMax, yMin, yMax,
          width, height,
          extras: [areaPath],
          points: [{x: d, y: k*d, color: '#b04030'}],
        });
        container.querySelector('.viz-svg').innerHTML = svg;
        const W = 0.5 * k * d * d;
        container.querySelector('.viz-readout').innerHTML =
          `拉伸 d = <strong>${d.toFixed(2)}</strong> m &nbsp;|&nbsp; $W = \\frac{1}{2}kd^2 = \\frac{1}{2}(${k})(${d.toFixed(2)})^2$ = <strong>${W.toFixed(2)}</strong> J &nbsp;(= 阴影面积)`;
      };
      container.innerHTML = `
        <div class="viz-svg"></div>
        <div class="viz-controls">
          <span style="font-size:0.85em;color:#666;">拉伸量 d (m):</span>
          <input type="range" min="0.05" max="0.45" step="0.01" value="${d}">
        </div>
        <div class="viz-readout" style="font-size:0.85em;color:#666;font-family:ui-monospace,monospace;margin-top:0.4em;"></div>`;
      container.querySelector('input').oninput = e => { d = parseFloat(e.target.value); draw(); };
      draw();
      renderAllMath(container);
    },

    'viz-l35': () => {
      let t = 5;
      const draw = () => {
        const padL = 38, padR = 14, padT = 14, padB = 28;
        const width = 560, height = 280;
        const plotW = width - padL - padR;
        const plotH = height - padT - padB;
        const xMin = 0.2, xMax = t + 0.5, yMin = -0.2, yMax = 2;
        const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
        const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

        let fill1 = `M${sx(1).toFixed(1)},${sy(0).toFixed(1)}`;
        for (let i = 0; i <= 80; i++) {
          const xi = 1 + (i/80)*(t-1);
          fill1 += ` L${sx(xi).toFixed(1)},${sy(1/(xi*xi)).toFixed(1)}`;
        }
        fill1 += ` L${sx(t).toFixed(1)},${sy(0).toFixed(1)} Z`;

        const svg = svgPlot({
          fn: [
            {fn: x => x > 0.2 ? 1/x : NaN, color: '#b04030', dashed: true, label: '1/x（发散）'},
            {fn: x => x > 0.2 ? 1/(x*x) : NaN, color: '#2c4a7a', label: '1/x²（收敛）'},
          ],
          xMin, xMax, yMin, yMax,
          width, height,
          extras: [`<path d="${fill1}" fill="rgba(44,74,122,0.12)" stroke="none"/>`],
        });
        container.querySelector('.viz-svg').innerHTML = svg;
        const area = 1 - 1/t;
        container.querySelector('.viz-readout').innerHTML =
          `积分上限 t = <strong>${t.toFixed(1)}</strong> &nbsp;|&nbsp; $\\int_1^t \\frac{1}{x^2}dx = 1 - 1/t$ = <strong>${area.toFixed(4)}</strong> → 1（收敛） &nbsp;|&nbsp; $\\int_1^t \\frac{1}{x}dx = \\ln t$ = <strong>${Math.log(t).toFixed(4)}</strong> → ∞（发散）`;
      };
      container.innerHTML = `
        <div class="viz-svg"></div>
        <div class="viz-controls">
          <span style="font-size:0.85em;color:#666;">上限 t:</span>
          <input type="range" min="2" max="20" step="0.5" value="${t}">
        </div>
        <div class="viz-readout" style="font-size:0.85em;color:#666;font-family:ui-monospace,monospace;margin-top:0.4em;"></div>
        <p style="font-size:0.85em;color:#666;margin-top:0.5em;">蓝色阴影 = $\\int_1^t 1/x^2\\,dx$，随 $t$ 增大趋于 $1$（收敛）。红色虚线 $1/x$ 衰减太慢，面积无限增长（发散）。</p>`;
      container.querySelector('input').oninput = e => { t = parseFloat(e.target.value); draw(); };
      draw();
      renderAllMath(container);
    },

    'viz-l36': () => {
      const f = x => Math.exp(-x*x);
      let n = 4;
      const a = 0, b = 2;
      const trueVal = 0.88208;
      const draw = () => {
        const dx = (b - a) / n;
        const padL = 38, padR = 14, padT = 14, padB = 28;
        const width = 560, height = 280;
        const plotW = width - padL - padR;
        const plotH = height - padT - padB;
        const xMin = -0.3, xMax = 2.5, yMin = -0.1, yMax = 1.2;
        const sx = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
        const sy = y => padT + (1 - (y - yMin) / (yMax - yMin)) * plotH;

        let trapezoids = '';
        let Tn = 0;
        for (let i = 0; i < n; i++) {
          const x0 = a + i * dx;
          const x1 = a + (i+1) * dx;
          const y0 = f(x0), y1 = f(x1);
          Tn += (y0 + y1) * dx / 2;
          trapezoids += `<path d="M${sx(x0).toFixed(1)},${sy(0).toFixed(1)} L${sx(x0).toFixed(1)},${sy(y0).toFixed(1)} L${sx(x1).toFixed(1)},${sy(y1).toFixed(1)} L${sx(x1).toFixed(1)},${sy(0).toFixed(1)} Z" fill="rgba(176,64,48,0.12)" stroke="#b04030" stroke-width="0.8"/>`;
        }

        const svg = svgPlot({
          fn: [{fn: f, color: '#2c4a7a', label: 'e^(-x²)', width: 2.5}],
          xMin, xMax, yMin, yMax,
          width, height,
          extras: [trapezoids],
        });
        container.querySelector('.viz-svg').innerHTML = svg;
        const err = Math.abs(Tn - trueVal);
        container.querySelector('.viz-readout').innerHTML =
          `n = <strong>${n}</strong> &nbsp;|&nbsp; 梯形法则 $T_n$ = <strong>${Tn.toFixed(5)}</strong> &nbsp;|&nbsp; 真值 ≈ 0.88208 &nbsp;|&nbsp; 误差 = ${err.toFixed(5)}`;
      };
      container.innerHTML = `
        <div class="viz-svg"></div>
        <div class="viz-controls">
          <span style="font-size:0.85em;color:#666;">梯形数 n:</span>
          <input type="range" min="2" max="20" step="1" value="${n}">
        </div>
        <div class="viz-readout" style="font-size:0.85em;color:#666;font-family:ui-monospace,monospace;margin-top:0.4em;"></div>
        <p style="font-size:0.85em;color:#666;margin-top:0.5em;">红色梯形拟合蓝色曲线 $e^{-x^2}$（没有初等原函数）。增加 n 观察误差下降。</p>`;
      container.querySelector('input').oninput = e => { n = parseInt(e.target.value); draw(); };
      draw();
      renderAllMath(container);
    },
  };
  if (renderers[id]) renderers[id]();
  else container.innerHTML = '<p style="color:#888;font-size:0.85em;">（可视化加载中…）</p>';
}

// ---------- State & Storage ----------
const STORAGE_KEY = 'calculus-tutorial-progress-v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {done: [], current: 1}; }
  catch (e) { return {done: [], current: 1}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
}
const state = loadProgress();

// ---------- Math rendering ----------
function renderAllMath(scope) {
  if (!window.__katexReady || !window.renderMathInElement) return;
  window.renderMathInElement(scope || document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
    ],
    throwOnError: false,
  });
}

// ---------- Renderers ----------
function renderNav() {
  const nav = document.getElementById('course-nav');
  const byMod = {};
  for (const l of LESSONS) (byMod[l.module] = byMod[l.module] || []).push(l);

  nav.innerHTML = MODULES.map(m => {
    const lessons = byMod[m.id] || [];
    const items = lessons.length
      ? lessons.map(l => `
          <li>
            <a href="#" data-lid="${l.id}"
               class="nav-item block px-3 py-1.5 rounded
                      ${state.current === l.id ? 'nav-active' : ''}
                      ${state.done.includes(l.id) ? 'nav-done' : ''}">
              <span class="text-xs text-[var(--muted)] mr-1">${l.id}.</span>${l.title}
            </a>
          </li>`).join('')
      : `<li class="px-3 py-1 text-xs text-[var(--muted)] italic">${m.desc}</li>`;
    return `
      <div>
        <div class="text-xs uppercase tracking-wider text-[var(--muted)] mb-1.5 px-3">
          ${m.id} · ${m.name}
        </div>
        <ul class="space-y-0.5">${items}</ul>
      </div>`;
  }).join('');

  nav.querySelectorAll('[data-lid]').forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      navigateTo(parseInt(a.dataset.lid));
      // close mobile drawer
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('drawer-backdrop').classList.remove('open');
    };
  });

  // progress summary
  const doneCount = state.done.length;
  const total = LESSONS.length; // 10 so far
  document.getElementById('progress-summary').innerHTML =
    `已完成 <strong>${doneCount}</strong> / ${total} 节`;
}

function renderLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  const view = document.getElementById('lesson-view');

  let sectionsHtml = '';
  for (const s of lesson.sections) {
    if (s.type === 'text') {
      sectionsHtml += `<div class="prose-body">${s.html}</div>`;
    } else if (s.type === 'viz') {
      sectionsHtml += `
        <div class="viz-wrap">
          <div class="text-xs text-[var(--muted)] mb-2">${s.label || '可视化'}</div>
          <div id="${s.id}-host"></div>
        </div>`;
    }
  }

  const exercisesHtml = lesson.exercises.map((ex, i) => {
    const hintHtml = ex.hint ? `
      <div class="mt-1 mb-1"><button class="ex-hint-btn">看提示</button></div>
      <div class="hint-block hidden ex-hint">
        <span class="text-xs uppercase tracking-wide font-semibold mr-1" style="color:#8c6b3a;">提示</span>
        ${ex.hint}
      </div>` : '';

    if (ex.type === 'mc') {
      return `
        <div class="lesson-card rounded-lg p-5 mb-4" data-ex="${i}" data-type="mc">
          <div class="text-xs text-[var(--muted)] mb-2">练习 ${i+1} · 选择题</div>
          <div class="ex-q mb-3">${ex.q}</div>
          ${hintHtml}
          <div class="space-y-2 ex-options mt-3">
            ${ex.options.map((opt, j) => `
              <button class="ex-option w-full text-left px-4 py-2.5 rounded-md" data-opt="${j}">
                <span class="text-[var(--muted)] mr-2">${String.fromCharCode(65+j)}.</span> ${opt}
              </button>`).join('')}
          </div>
          <div class="solution-block hidden ex-solution">
            <div class="text-xs uppercase tracking-wide font-semibold mb-1">解答</div>
            ${ex.solution}
          </div>
        </div>`;
    } else if (ex.type === 'fill') {
      return `
        <div class="lesson-card rounded-lg p-5 mb-4" data-ex="${i}" data-type="fill">
          <div class="text-xs text-[var(--muted)] mb-2">练习 ${i+1} · 填空题</div>
          <div class="ex-q mb-3">${ex.q} <input class="fill-input ex-input" placeholder="答案" /></div>
          ${hintHtml}
          <div class="flex gap-2 items-center text-sm mt-3 flex-wrap">
            <button class="ex-check px-3 py-1.5 rounded-md bg-[var(--accent)] text-white">检查</button>
            <button class="ex-show px-3 py-1.5 rounded-md border border-[var(--line)]">看解答</button>
            <span class="ex-feedback text-xs"></span>
          </div>
          <div class="solution-block hidden ex-solution">
            <div class="text-xs uppercase tracking-wide font-semibold mb-1">解答</div>
            ${ex.solution}
          </div>
        </div>`;
    }
    return '';
  }).join('');

  const doneClass = state.done.includes(id) ? 'bg-[var(--good)] text-white border-[var(--good)]' : 'border-[var(--line)] hover:bg-[var(--accent-soft)]';
  const doneLabel = state.done.includes(id) ? '✓ 已完成本节' : '标记本节为已完成';

  view.innerHTML = `
    <div class="text-xs text-[var(--muted)] uppercase tracking-wider mb-2">
      ${lesson.module} · ${MODULES.find(m => m.id === lesson.module).name} · 第 ${lesson.id} 节
    </div>
    <h1 class="serif text-3xl md:text-4xl font-semibold leading-tight mb-3">${lesson.title}</h1>
    <p class="text-lg text-[var(--muted)] mb-8 leading-relaxed">${lesson.hook}</p>

    ${sectionsHtml}

    <h2 class="serif text-2xl font-semibold mt-12 mb-4">练习</h2>
    ${exercisesHtml}

    <div class="mt-8">
      <button id="mark-done"
              class="px-4 py-2 rounded-md border ${doneClass} text-sm transition">
        ${doneLabel}
      </button>
    </div>
  `;

  // Render visualizations
  lesson.sections.filter(s => s.type === 'viz').forEach(s => {
    const host = document.getElementById(`${s.id}-host`);
    if (host) renderViz(s.id, host);
  });

  // Wire exercises
  view.querySelectorAll('[data-type="mc"]').forEach(card => {
    const i = parseInt(card.dataset.ex);
    const ex = lesson.exercises[i];
    card.querySelectorAll('.ex-option').forEach(btn => {
      btn.onclick = () => {
        const chosen = parseInt(btn.dataset.opt);
        card.querySelectorAll('.ex-option').forEach(b => b.classList.remove('correct', 'wrong', 'selected'));
        btn.classList.add('selected');
        if (chosen === ex.answer) {
          btn.classList.add('correct');
          card.querySelector('.ex-solution').classList.remove('hidden');
        } else {
          btn.classList.add('wrong');
          const right = card.querySelector(`[data-opt="${ex.answer}"]`);
          if (right) right.classList.add('correct');
          card.querySelector('.ex-solution').classList.remove('hidden');
        }
        renderAllMath(card);
      };
    });
  });

  view.querySelectorAll('[data-type="fill"]').forEach(card => {
    const i = parseInt(card.dataset.ex);
    const ex = lesson.exercises[i];
    const input = card.querySelector('.ex-input');
    const feedback = card.querySelector('.ex-feedback');

    const check = () => {
      const val = input.value.trim().replace(/\s+/g, '').toLowerCase();
      const accept = (ex.accept || [ex.answer]).map(a => String(a).trim().replace(/\s+/g,'').toLowerCase());
      let ok = accept.includes(val);
      if (!ok) {
        const numVal = parseFloat(val);
        const numAns = parseFloat(ex.answer);
        if (!isNaN(numVal) && !isNaN(numAns) && Math.abs(numVal - numAns) < 1e-6) ok = true;
      }
      input.classList.remove('correct', 'wrong');
      if (ok) {
        input.classList.add('correct');
        feedback.textContent = '✓ 正确';
        feedback.style.color = 'var(--good)';
        card.querySelector('.ex-solution').classList.remove('hidden');
        renderAllMath(card);
      } else {
        input.classList.add('wrong');
        feedback.textContent = '× 再想想';
        feedback.style.color = 'var(--bad)';
      }
    };

    card.querySelector('.ex-check').onclick = check;
    input.onkeydown = e => { if (e.key === 'Enter') check(); };
    card.querySelector('.ex-show').onclick = () => {
      card.querySelector('.ex-solution').classList.remove('hidden');
      renderAllMath(card);
    };
  });

  // Hint buttons (applies to both MC and fill)
  view.querySelectorAll('.ex-hint-btn').forEach(btn => {
    btn.onclick = () => {
      const card = btn.closest('[data-ex]');
      const hint = card.querySelector('.ex-hint');
      if (hint) {
        hint.classList.remove('hidden');
        btn.style.display = 'none';
        renderAllMath(card);
      }
    };
  });

  // Mark done
  document.getElementById('mark-done').onclick = () => {
    const idx = state.done.indexOf(id);
    if (idx === -1) state.done.push(id);
    else state.done.splice(idx, 1);
    saveProgress(state);
    renderNav();
    renderLesson(id);
  };

  // Prev/Next
  document.getElementById('prev-btn').disabled = id <= 1;
  document.getElementById('next-btn').disabled = id >= LESSONS.length;
  document.getElementById('prev-btn').onclick = () => navigateTo(id - 1);
  document.getElementById('next-btn').onclick = () => navigateTo(id + 1);

  renderAllMath();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function navigateTo(id) {
  if (id < 1 || id > LESSONS.length) return;
  state.current = id;
  saveProgress(state);
  renderNav();
  renderLesson(id);
}

// ---------- Init ----------
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderLesson(state.current);

  // mobile drawer
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('drawer-backdrop');
  document.getElementById('menu-btn')?.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('open');
  });
  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
  });
});

// re-render math when katex finishes loading after content is built
window.renderAllMath = renderAllMath;
</script>
</body>
</html>
